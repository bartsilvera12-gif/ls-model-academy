<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Página no encontrada — IS Model Management</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="favicon.ico" sizes="any" />

<meta name="theme-color" content="#0B0B0B" />

<style>
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; background:#0B0B0B; color:#F7F7F4;
    font-family:'Jost','Helvetica Neue',Helvetica,sans-serif;
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding:40px 24px; position:relative; overflow:hidden;
  }
  .mark {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    height:min(80vh,620px); width:auto; opacity:.05; pointer-events:none;
  }
  .inner { position:relative; z-index:1; }
  .code {
    margin:0; font-family:'Cormorant Garamond',serif; font-weight:300;
    font-size:clamp(72px,16vw,180px); line-height:1; letter-spacing:-.02em;
  }
  h1 {
    margin:18px 0 0; font-family:'Cormorant Garamond',serif; font-weight:300;
    font-size:clamp(24px,4vw,40px); line-height:1.1; text-transform:uppercase; letter-spacing:.02em;
  }
  p { margin:22px auto 0; max-width:40ch; font-size:14px; line-height:1.85; color:rgba(247,247,244,.7); font-weight:300; }
  .links { display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin-top:40px; }
  a.btn {
    display:inline-flex; align-items:center; gap:14px; min-height:54px; padding:0 32px;
    border:1px solid rgba(247,247,244,.42); color:#F7F7F4; text-decoration:none;
    font-size:11px; letter-spacing:.28em; text-transform:uppercase;
    transition:background .4s ease,color .4s ease,border-color .4s ease;
  }
  a.btn:hover { background:#F7F7F4; color:#0B0B0B; border-color:#F7F7F4; }
</style>
</head>
<body>
  <img class="mark" src="assets/logo-white.png" alt="" aria-hidden="true" />
  <div class="inner">
    <p class="code">404</p>
    <h1>Esta página no existe</h1>
    <p>Puede que el enlace esté desactualizado o que la dirección tenga un error.</p>
    <div class="links">
      <a class="btn" href="/">Ir al inicio</a>
      <a class="btn" href="/staff.html">Ver modelos</a>
    </div>
  </div>
</body>
